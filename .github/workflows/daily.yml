name: Daily Anime Recap

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC (9:00 AM India time)
  workflow_dispatch:        # lets you press "Run workflow" to test

# Only one run at a time, so two runs can never process the same video.
concurrency:
  group: anime-recap-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          pip install -r requirements.txt

      - name: Run tests (mocked, nothing is uploaded)
        run: python -W ignore -m unittest discover -s tests

      - name: Run automation
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INCOMING_FOLDER_ID: ${{ secrets.INCOMING_FOLDER_ID }}
          LONG_FOLDER_ID: ${{ secrets.LONG_FOLDER_ID }}
          SHORTS_FOLDER_ID: ${{ secrets.SHORTS_FOLDER_ID }}
          DONE_FOLDER_ID: ${{ secrets.DONE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
